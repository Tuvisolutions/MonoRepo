          type: string
          description: Includes shared_email_limit for repeated addresses and delivery_unknown, delivery_failure_not_retryable, delivery_outcome_conflict, or delivery_retry_exhausted when retry safety pauses the campaign.

    OutreachRecipientList:
      type: object
