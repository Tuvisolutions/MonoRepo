        restaurant_name:
          type: string
          description: Backward-compatible synthetic name used only when restaurant_id is absent.
        owner_first_name:
          type: string
          description: Backward-compatible synthetic owner name used only when restaurant_id is absent.

    RenderedOutreachSequenceStep:
      type: object
      required: [position, delay_hours, subject, body_text, url_count]
