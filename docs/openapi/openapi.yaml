          format: email
          description: Single custom recipient that receives every rendered outreach template.
        sequence_id:
          type: string
          format: uuid
          description: Optional exact saved sequence to test. When omitted, the active approved sequence is used.
        restaurant_id:
          type: string
          format: uuid
          description: Optional authoritative restaurant lookup; takes precedence over synthetic fields.
        restaurant_name:
