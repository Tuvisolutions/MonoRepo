          items:
            $ref: '#/components/schemas/ScrapeJob'

    CampaignStatus:
      type: string
      enum: [draft, approved, sending, sent, stopped, send_unknown]
      description: |
        `send_unknown` is a fail-closed terminal state for an ambiguous provider result.
        It requires manual reconciliation and cannot be re-approved or retried automatically.

    CampaignType:
      type: string
      enum: [outreach]
      default: outreach

    EmailEventType:
      type: string
      enum: [sent, skipped, opened, clicked, failed, unsubscribed, draft_regenerated]

    CreateCampaignRequest:
      type: object
      required: [demo_site_id, demo_token]
      properties:
        demo_site_id:
          type: string
          format: uuid
          description: Draft or published demo site belonging to this restaurant
        demo_token:
          type: string
          description: One-time token from `POST .../demo-sites` response
        campaign_type:
          $ref: '#/components/schemas/CampaignType'

    CampaignApprovalRequest:
      type: object
      required: [expected_updated_at]
      properties:
        expected_updated_at:
          type: string
          format: date-time
          description: Historical campaign version timestamp retained for stored records.

    OutreachSequenceStatus:
      type: string
      enum: [draft, approved, archived]

    OutreachSequenceStep:
      type: object
      required: [position, enabled, delay_hours, subject_template, body_text_template]
      properties:
        id:
          type: string
          format: uuid
        sequence_id:
          type: string
          format: uuid
        position:
          type: integer
          minimum: 1
        enabled:
          type: boolean
        delay_hours:
          type: integer
          minimum: 0
          maximum: 8760
          description: The first enabled step must be 0; subsequent values are measured from the preceding confirmed send.
        subject_template:
          type: string
          maxLength: 200
          description: Plain-text subject. `[GREETING]` and `{{greeting01}}` are never allowed here.
        body_text_template:
          type: string
          maxLength: 10000
          description: |
            Plain-text template body. `[GREETING]` (or legacy `{{greeting01}}`) may appear
            exactly once and only in the first enabled email. Other supported square-bracket
            placeholders are replaced from saved restaurant/verified Google facts at render time.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    OutreachEmailSignature:
      type: object
      required: [name, title, additional_details]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
          description: Editable sender name; defaults to Praveen Maurya.
        title:
          type: string
          maxLength: 160
          description: Editable sender title; defaults to Business Development Manager.
        additional_details:
          type: string
          maxLength: 1000
          description: Optional plain-text lines such as a phone number, email, or availability. Tuvi branding remains fixed.

    OutreachSequence:
      type: object
      required: [id, name, version, status, is_active, created_at, updated_at, signature, steps]
