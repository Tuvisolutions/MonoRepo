  /api/v1/outreach/deliveries:
    get:
      tags: [Email Campaigns]
      summary: List scheduled outreach attempts for one Sydney date
      operationId: listDailyOutreachDeliveries
      security:
        - bearerAuth: []
      description: |
        Requires role `internal_admin`. Lists quota-managed scheduled outreach attempts
        whose attempt timestamp falls on the requested `Australia/Sydney` calendar date.
        All ledger outcomes are included so From-address totals reconcile: sending,
        sent, skipped, failed, and unknown. A `sent` outcome means the provider accepted
        the message; it does not prove inbox delivery. A later bounce appears as failed
        only after a separate reconciliation records it. Template tests, inbox replies,
        health checks, and other direct messages are outside this ledger.
      parameters:
        - name: date
          in: query
          required: true
          description: Australia/Sydney calendar date.
          schema:
            type: string
            format: date
        - name: account_id
          in: query
          description: Optional ledger sender id returned in the response's sender summaries.
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: Daily sender totals and paginated scheduled delivery attempts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DailyOutreachDeliveryList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          description: Scheduled outreach delivery history is unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/outreach/inbox:
    get:
      tags: [Email Campaigns]
      summary: List outreach inbox threads
      operationId: listOutreachInbox
      security:
        - bearerAuth: []
      description: |
        Requires role `internal_admin`. Lists conversations received during the last
        10 days across every configured Google Workspace outreach mailbox. Messages
        that cannot be matched to a restaurant are retained as unmatched threads and
        can be excluded with `restaurant_only=true`.
        Each summary's subject, text snippet, sender, recipient, received timestamp,
        and reply message id come from its latest received inbound message. Threads
        are ordered by that received timestamp first; unread count and later outbound
        replies do not move an older received message ahead of a newer one.
      parameters:
        - name: unread
          in: query
          schema:
            type: boolean
            default: false
        - name: mailbox
          in: query
          description: Optional stable mailbox account key. Omit to combine all configured mailboxes.
          schema:
            type: string
            maxLength: 200
        - name: restaurant_only
          in: query
          description: When true, return only matched threads with a restaurant id and non-empty restaurant name.
          schema:
            type: boolean
            default: false
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: Outreach inbox threads
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OutreachInboxList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

