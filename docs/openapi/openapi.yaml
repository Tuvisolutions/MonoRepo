        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          description: Sending is disabled or the captured mailbox is not configured for sending
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/outreach/bulk-send:
    post:
      tags: [Email Campaigns]
      summary: Enable and trigger the Gmail outreach job (compatibility route)
      operationId: triggerBulkOutreachSend
      security:
        - bearerAuth: []
      description: |
        Requires role `internal_admin`. Enables the persisted email-job control and enqueues
        an `outreach.bulk_send` job. The admin UI uses `PATCH /api/v1/outreach/email-job`.

        Eligible recipients have a name, valid business email, inferred-business consent
        evidence, lifecycle `lead` or `emailed`, and no expressed interest.
        Profile, demo, image-analysis, and legacy campaign readiness are not prerequisites.

        Every current sequence body is authored as plain text and rendered with a small
        HTML alternative only for line breaks and the Tuvi logo signature. An in-progress
        campaign keeps the subject/body copy from its enrolled version but uses the current
        active approved signature at dispatch time; signature lookup failure stops before
        provider delivery. Rendering permits exactly `https://tuvisolutions.com`.
        The first enabled step is immediate; each later enabled step uses its configured
        delay (the approved default sequence uses 72 hours). Due follow-ups rank before
        new recipients but never remove new recipients from eligibility. Addresses used by
        more than three restaurant records are excluded and rechecked before delivery.

        Confirmed provider acceptance alone advances `current_step`, records the send time,
        and schedules the next enabled step. Skipped or failed/ambiguous outcomes never
        advance. Provider quotas and pacing remain PostgreSQL-backed and restart-safe.
        Each mailbox starts at 5 attempts for its first fully used allowance, then rises
        by 5 after each fully used Sydney send day until it reaches and remains at the
        configured ceiling (maximum 40). Scheduled provider attempts occur only inside
        the admin-saved, start-inclusive/end-exclusive `Australia/Sydney` window; mailbox
        allowances run concurrently so the aggregate quota can finish before its end.
      responses:
        '202':
          description: Bulk job queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkOutreachTriggerResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Bulk job already active
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Gmail OAuth outreach accounts not configured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/outreach/email-job:
    patch:
      tags: [Email Campaigns]
      summary: Enable or disable the Gmail outreach job from the admin UI
      operationId: setOutreachEmailJob
      security:
        - bearerAuth: []
      description: |
        Requires role `internal_admin`. `enabled=true` persists the operational control and
        immediately queues one durable run over eligible inferred-business recipients.
        `enabled=false` cancels any safely deferred queued job and prevents another provider
        attempt; an in-flight request keeps its fenced lease long enough to record the exact
        outcome. Re-enabling can resume that one lease without creating a competing job.
        Outside the saved `Australia/Sydney` window, the queued job defers without
        claiming a provider slot.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled:
                  type: boolean
      responses:
        '200':
          description: Persisted email-job state and queued job metadata when enabling
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailJobActionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Another outreach job is already queued or running
        '503':
          description: Gmail OAuth outreach accounts are not configured

  /api/v1/outreach/send-window:
    patch:
      tags: [Email Campaigns]
      summary: Set the scheduled outreach window from the admin UI
      operationId: setOutreachSendWindow
      security:
        - bearerAuth: []
      description: |
        Requires role `internal_admin`. Persists a same-day, start-inclusive and
        end-exclusive window in `Australia/Sydney`. The email job must be disabled and no
        bulk outreach run may be queued or active. The server rejects a window that cannot
        fit the configured mailboxes' full daily quota at the minimum pacing interval.
        Template tests, inbox replies, health checks, and other direct email are exempt.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OutreachSendScheduleUpdate'
      responses:
        '200':
          description: Saved outreach send window
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OutreachSendSchedule'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Email job is enabled or a bulk outreach run is queued/running

