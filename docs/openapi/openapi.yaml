  /api/v1/restaurants/{id}/profile/review:
    parameters:
      - $ref: '#/components/parameters/restaurantId'
    patch:
      tags: [Lead Review]
      summary: Record a human profile review decision
      operationId: reviewRestaurantProfile
      security:
        - bearerAuth: []
      description: |
        Requires role `internal_admin`. Records `reviewed_at` and `reviewed_by` for
        `approved` or `rejected`; returning the profile to `draft` clears both audit fields.
        Approved or rejected decisions must submit both timestamps from the protected preview; a
        changed restaurant/profile returns `409 stale_review`. Every new profile decision
        returns published demos and approved campaigns to draft for downstream re-review.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileReviewRequest'
            example:
              status: approved
              expected_restaurant_updated_at: '2026-07-14T10:00:00Z'
              expected_profile_updated_at: '2026-07-14T10:01:00Z'
      responses:
        '200':
          description: Profile review state and audit metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileReview'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The reviewed restaurant/profile artifact changed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/demo-sites/{id}/review-preview:
    parameters:
      - $ref: '#/components/parameters/demoSiteId'
    get:
      tags: [Lead Review, Demo Sites]
      summary: Inspect a demo's review-safe public payload
      operationId: getDemoReviewPreview
      security:
        - bearerAuth: []
      description: |
        Requires role `internal_admin`. Returns the exact allowlisted payload that the
        token-gated public demo would expose, including its server-derived restaurant ID,
        while the demo is still a draft. The response never includes the demo token or
        token hash and is marked `Cache-Control: no-store`.
      responses:
        '200':
          description: Review-safe demo metadata and public payload
          headers:
            Cache-Control:
              schema:
                type: string
              description: Always `no-store`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DemoReviewPreview'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/demo-sites/{id}/status:
    parameters:
      - $ref: '#/components/parameters/demoSiteId'
    patch:
      tags: [Lead Review, Demo Sites]
      summary: Publish or return a demo to draft
      operationId: setDemoSiteStatus
      security:
        - bearerAuth: []
      description: |
        Requires role `internal_admin`. Publishing records `published_at` and
        `published_by`, and is rejected unless the restaurant profile has been
        human-approved with an attributable reviewer. An expired token-gated
        demo must be regenerated before it can be published. Returning to `draft` makes
        the demo unavailable publicly and clears the publication audit fields. Publication
        must include `expected_updated_at` from the protected demo review preview; stale
        content is rejected with `409 stale_review`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DemoStatusRequest'
            example:
              status: published
              expected_updated_at: '2026-07-14T10:02:00Z'
      responses:
        '200':
          description: Demo status and publication audit metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DemoReview'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Profile review is incomplete, the demo expired, or the reviewed artifact changed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/scrape-jobs:
    post:
      tags: [Scrape Jobs]
      summary: Trigger or retrieve an active city scrape job
      operationId: triggerCityScrapeJob
      security:
        - bearerAuth: []
      description: |
        Requires role `internal_admin`. Creates one durable active job per normalized
        city/niche pair, or returns the existing `queued`, `running`, or `waiting` job.
        Supported cities are Adelaide, Brisbane, Melbourne, Perth, and Sydney; supported
        niches are `restaurant`, `dentist`, and `plumber` (`restaurant` by default).

        The scrape worker partitions the city into durable grid cells, subdivides saturated
        cells, deduplicates candidates by Google Place ID, and uses Google Places before
        best-effort targeted Apollo enrichment for missing owner/work-email details. Missing
        Apollo configuration switches the job to Places-only processing; Apollo provider
        failures are recorded on that candidate while verified Places data continues to
        import. The combined provider request window is capped at 500. A capped job becomes
        `waiting` with `resume_at` set
        24 hours later, then resumes from persisted cell/page/candidate state. A completed
        coverage pass is revisited in later cycles so newly added Place IDs can be discovered.
        A leaf that remains provider-capped at the configured maximum grid depth stays
        incomplete with `waiting_reason=coverage_incomplete`; it is not reported as a
        completed city coverage pass.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateScrapeJobRequest'
            example:
              city: Melbourne
              niche: restaurant
      responses:
        '202':
          description: New scrape job created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScrapeJobTriggerResult'
        '200':
          description: Existing active city/niche job returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScrapeJobTriggerResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          description: Unsupported city or niche
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    get:
      tags: [Scrape Jobs]
      summary: List recent city scrape jobs
      operationId: listCityScrapeJobs
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            default: 25
          description: Values above 100 are capped at 100.
      responses:
        '200':
          description: Recent scrape jobs ordered by creation time descending
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScrapeJobList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/scrape-jobs/{id}:
    parameters:
      - $ref: '#/components/parameters/scrapeJobId'
    get:
      tags: [Scrape Jobs]
      summary: Get city scrape job progress
      operationId: getCityScrapeJob
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Durable request-window, resume, grid, and candidate progress
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScrapeJob'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/scrape-jobs/{id}/resume:
    parameters:
      - $ref: '#/components/parameters/scrapeJobId'
    post:
      tags: [Scrape Jobs]
      summary: Resume a failed city scrape job from its durable progress
      operationId: resumeCityScrapeJob
      security:
        - bearerAuth: []
      description: |
        Requires role `internal_admin`. Requeues only a `failed` job, resets failed
        cells/candidates for another attempt, and preserves imported candidates and
        all completed durable city progress. A candidate stopped during optional Apollo
        enrichment remains at its saved Places-details checkpoint. A request window older
        than 24 hours is reset; a newer window keeps its consumed request count.
      responses:
        '202':
          description: Failed job resumed from durable progress
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScrapeJob'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Scrape job is not failed, or another active city/niche job exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/scrape-jobs/{id}/retry:
    parameters:
      - $ref: '#/components/parameters/scrapeJobId'
    post:
      deprecated: true
      tags: [Scrape Jobs]
      summary: Legacy alias for resuming a failed city scrape job
      operationId: retryCityScrapeJob
      security:
        - bearerAuth: []
      description: |
        Backward-compatible alias for `POST /api/v1/scrape-jobs/{id}/resume`.
        New admin clients should use the resume endpoint.
      responses:
        '202':
          description: Failed job resumed from durable progress
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScrapeJob'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Scrape job is not failed, or another active city/niche job exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/outreach/sequences:
    get:
      tags: [Email Campaigns]
      summary: List outreach templates
      operationId: listOutreachSequences
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Active template ID and stored template rows
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OutreachSequenceList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Email Campaigns]
      summary: Create an editable outreach template
      operationId: createOutreachSequence
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOutreachSequenceRequest'
      responses:
        '201':
          description: Editable outreach template
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OutreachSequence'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/v1/outreach/sequences/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      tags: [Email Campaigns]
      summary: Replace an editable outreach template's name and steps
      operationId: updateOutreachSequence
      security:
        - bearerAuth: []
      description: |
        Steps are contiguous and 1-based. The first enabled step must use `delay_hours=0`.
        Bodies and editable signature fields are plain text. Supported placeholders are
        `[GREETING]`, `[FIRST_NAME]`, `[RESTAURANT_NAME]`, `[CUISINE]`, `[CITY]`,
        `[RATING]`, `[TOTAL_REVIEWS]`, and `[WEBSITE_URL]`. Existing `{{greeting}}`,
        `{{greeting01}}`, `{{restaurant_name}}`, and `{{website_url}}` aliases remain valid.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOutreachSequenceRequest'
      responses:
        '200':
          description: Updated draft
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OutreachSequence'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/outreach/sequences/{id}/approve:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [Email Campaigns]
      summary: Make an outreach template active
      operationId: approveOutreachSequence
      security:
        - bearerAuth: []
      description: |
        Activation archives the prior active row. Untouched recipients (`current_step=0`
        with no delivery attempt/event) are atomically rebased to the new first enabled step;
        any recipient with delivery history remains pinned to the original row.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApproveOutreachSequenceRequest'
      responses:
        '200':
          description: Approved active sequence
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OutreachSequence'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

