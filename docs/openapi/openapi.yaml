  /api/v1/outreach/test-send:
    post:
      tags: [Email Campaigns]
      summary: Send outreach templates to a custom test recipient
      operationId: sendOutreachTemplateTest
      security:
        - bearerAuth: []
      description: |
        Requires role `internal_admin`. When `sequence_id` is supplied, sends every enabled
        step from that exact saved draft, approved, or archived sequence. Otherwise it uses
        the active sequence used by live outreach. There is no extra base message or
        test-only subject prefix. This is a
        custom-recipient test path: it does not mutate lead/campaign delivery state,
        does not enroll recipients, does not consume scheduled daily quota, and is not
        restricted to the scheduled Sydney send window. It does not send to restaurant leads. Messages use
        the saved sequence's editable sender signature with the fixed Tuvi logo, company,
        website, and brand colours. Any unsubscribe copy is supplied by the
        saved database template; this endpoint does not add or validate it.
        When `restaurant_id` is supplied, authoritative server-side greeting facts
        replace any synthetic restaurant name or owner fields. The response returns
        the exact deterministic greeting and the fact categories used.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OutreachTemplateTestSendRequest'
      responses:
        '200':
          description: Template test emails sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OutreachTemplateTestSendResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          description: Email sending is disabled or outreach accounts are not configured

  /api/v1/outreach/email-accounts:
    get:
      tags: [Email Campaigns]
      summary: List environment and database outreach email accounts
      operationId: listOutreachEmailAccounts
      security:
        - bearerAuth: []
      description: |
        Requires role `internal_admin`. Returns mailbox identity and effective status only;
        OAuth credentials are never returned. A database row with the same account key and
        normalized mailbox replaces the environment account. A disabled or unreadable database
        override fails closed and does not fall back to environment credentials.
      responses:
        '200':
          description: Deduplicated outreach email account registry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OutreachEmailAccountList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Email Campaigns]
      summary: Add an encrypted database-managed Gmail outreach account
      operationId: createOutreachEmailAccount
      security:
        - bearerAuth: []
      description: |
        Requires role `internal_admin`. The complete Gmail OAuth credential set is encrypted
        before storage. The account participates in outreach sending and unified inbox polling
        without a process restart. Supplying both the exact account key and mailbox of an
        environment account creates a database override; partial key or mailbox collisions and
        duplicate database identities are rejected.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOutreachEmailAccountRequest'
      responses:
        '201':
          description: Database-managed email account created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OutreachEmailAccount'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          description: Secure credential storage is not configured

  /api/v1/outreach/email-accounts/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      tags: [Email Campaigns]
      summary: Enable, disable, or replace credentials for a database email account
      operationId: updateOutreachEmailAccount
      security:
        - bearerAuth: []
      description: |
        Requires role `internal_admin`. Account key and mailbox identity are immutable.
        Disabling retains history but immediately excludes the account from new sending and polls.
        Credential replacement requires the complete new OAuth credential set. When the row
        overrides an environment account, disabling it does not restore the environment secret.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOutreachEmailAccountRequest'
      responses:
        '200':
          description: Updated database-managed account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OutreachEmailAccount'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          description: Secure credential storage is not configured

  /api/v1/outreach/email-accounts/health:
    get:
      tags: [Email Campaigns]
      summary: List configured Gmail outreach sender health
      operationId: listGmailOutreachHealth
      security:
