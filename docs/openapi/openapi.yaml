        approved_at:
          type: string
          format: date-time
          nullable: true
        approved_by:
          type: string
          format: uuid
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        signature:
          $ref: '#/components/schemas/OutreachEmailSignature'
        steps:
          type: array
          items:
            $ref: '#/components/schemas/OutreachSequenceStep'

    OutreachSequenceList:
      type: object
      required: [sequences]
      properties:
        active_sequence_id:
          type: string
          format: uuid
          nullable: true
        sequences:
          type: array
          items:
            $ref: '#/components/schemas/OutreachSequence'

    CreateOutreachSequenceRequest:
      type: object
      required: [name]
      properties:
