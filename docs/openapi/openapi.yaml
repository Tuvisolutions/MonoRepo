  /api/v1/outreach/messages/{id}/reply:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [Email Campaigns]
      summary: Send a custom plain-text reply to an inbound outreach message
      operationId: replyToOutreachMessage
      security:
        - bearerAuth: []
      description: |
        Requires role internal_admin. Sends from the same configured Gmail mailbox and
        Gmail thread that captured the inbound message, then stores the accepted outbound
        snapshot. The reply uses the current active approved sequence signature and fails
        before provider delivery if that signature cannot be loaded. It does not consume
        scheduled daily quota or wait for the Sydney send window, and it does not restart
        a campaign paused by the inbound reply.
      requestBody:
        required: true
        content:
          application/json:
