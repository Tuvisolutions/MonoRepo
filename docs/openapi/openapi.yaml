        - cycle_number
        - max_requests_per_window
        - requests_used_window
        - requests_used_total
        - created_at
        - updated_at
        - progress
      properties:
        id:
          type: string
          format: uuid
        city:
          type: string
        city_key:
          type: string
        niche:
          type: string
        status:
