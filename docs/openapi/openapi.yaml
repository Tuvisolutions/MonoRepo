        start_time:
          type: string
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
          example: '07:00'
        end_time:
          type: string
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
          example: '12:00'
        updated_by:
          type: string
          format: uuid
          nullable: true
        updated_at:
          type: string
          format: date-time

