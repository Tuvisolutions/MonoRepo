        position:
          type: integer
        delay_hours:
          type: integer
        subject:
          type: string
        body_text:
          type: string
        url_count:
          type: integer
          description: Number of rendered URLs in the plain-text body.

    OutreachSequencePreview:
      type: object
      required: [restaurant_name, greeting, greeting01, facts_used, signature, steps]
      properties:
        restaurant_id:
          type: string
          format: uuid
        restaurant_name:
          type: string
        greeting:
          type: string
          description: Legacy salutation rendered for {{greeting}} compatibility.
        greeting01:
          type: string
          description: Deterministic Morning salutation, blank separator, and personalized restaurant observation.
        facts_used:
          type: array
          items:
            type: string
            enum: [owner_first_name, restaurant_name, cuisine, city, rating, review_count]
        signature:
          description: Persisted signature from the selected saved sequence version.
          allOf:
            - $ref: '#/components/schemas/OutreachEmailSignature'
        steps:
          type: array
          items:
            $ref: '#/components/schemas/RenderedOutreachSequenceStep'

    RestaurantGreetingPreview:
      type: object
      required: [restaurant_id, restaurant_name, greeting, greeting01, facts_used]
      properties:
        restaurant_id:
          type: string
          format: uuid
        restaurant_name:
          type: string
        greeting:
          type: string
          description: Legacy salutation for the greeting placeholder.
        greeting01:
          type: string
          description: Deterministic Morning salutation, blank separator, and personalized restaurant observation.
        facts_used:
          type: array
          items:
            type: string
            enum: [owner_first_name, restaurant_name, cuisine, city, rating, review_count]

    OutreachRecipient:
