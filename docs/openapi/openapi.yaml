        last_success_at:
          type: string
          format: date-time
          nullable: true
        last_error:
          type: string

    OutreachInboxList:
      type: object
      required: [threads, mailboxes, total]
      properties:
        threads:
          type: array
          items:
            $ref: '#/components/schemas/OutreachInboxThread'
        mailboxes:
          type: array
          items:
            $ref: '#/components/schemas/OutreachInboxMailboxStatus'
        total:
          type: integer
          minimum: 0

    BulkOutreachTriggerResponse:
      type: object
      properties:
        job_id:
          type: string
        status:
          type: string
          example: queued
        max_sends:
          type: integer
          example: 150
        pending_eligible_count:
          type: integer

    BulkOutreachStatusResponse:
      type: object
      required: [sent_counts]
      properties:
        pending_eligible_count:
          type: integer
        due_followup_count:
          type: integer
        new_recipient_count:
          type: integer
        paused_recipient_count:
          type: integer
        completed_recipient_count:
          type: integer
        sent_counts:
          $ref: '#/components/schemas/OutreachSentCounts'
        max_sends:
          type: integer
        email_job:
          $ref: '#/components/schemas/EmailJobControl'
        send_schedule:
          $ref: '#/components/schemas/OutreachSendSchedule'
        next_available_at:
          type: string
          format: date-time
          nullable: true
          description: Earliest durable email-account availability when all configured accounts are cooling down.
        active_job:
          type: object
          nullable: true
          properties:
            job_id:
              type: string
            status:
              type: string
        last_completed_job:
          type: object
          nullable: true
          properties:
            job_id:
              type: string
            status:
              type: string
            summary:
              type: object
              properties:
                attempted:
                  type: integer
                sent:
                  type: integer
                skipped:
                  type: integer
                failed:
                  type: integer
                max_sends:
                  type: integer
                stopped_reason:
                  type: string
                next_available_at:
                  type: string
                  format: date-time
                  nullable: true

    OutreachSentCounts:
      type: object
      required: [total, phase_1, phase_2, phase_3, other]
      description: Confirmed scheduled outreach sends recorded as sent delivery attempts, grouped by campaign step.
      properties:
        total:
          type: integer
          minimum: 0
          description: All confirmed sends, including campaign steps outside phases 1, 2, and 3.
        phase_1:
          type: integer
          minimum: 0
        phase_2:
          type: integer
          minimum: 0
        phase_3:
          type: integer
          minimum: 0
        other:
          type: integer
          minimum: 0
          description: Confirmed sends whose campaign step is not 1, 2, or 3.

    OutreachDeliveryOutcomeCounts:
      type: object
      required: [total, sent, failed, unknown, skipped, sending]
      properties:
        total:
          type: integer
          minimum: 0
          description: All scheduled quota attempts for the selected Sydney date and sender filter.
        sent:
          type: integer
          minimum: 0
          description: Attempts currently marked sent after provider acceptance; a separately reconciled bounce may later move an attempt to failed.
        failed:
          type: integer
          minimum: 0
          description: Attempts with a known final failure, including reconciled bounces.
        unknown:
          type: integer
          minimum: 0
          description: Ambiguous provider outcomes that must not be retried automatically.
        skipped:
          type: integer
          minimum: 0
        sending:
          type: integer
          minimum: 0

    DailyOutreachDeliverySender:
      type: object
      required: [account_id, account_key, sender_email, counts]
      properties:
        account_id:
          type: string
          format: uuid
          description: Stable delivery-ledger sender id used by the account_id filter.
        account_key:
          type: string
        sender_email:
          type: string
          description: Current effective From address for this ledger sender.
        counts:
          $ref: '#/components/schemas/OutreachDeliveryOutcomeCounts'

    DailyOutreachDelivery:
      type: object
      required:
        - id
        - restaurant_id
        - restaurant_name
        - recipient_email
        - account_id
        - account_key
        - sender_email
        - campaign_step
        - status
        - outcome
        - attempted_at
      properties:
        id:
          type: string
          format: uuid
        restaurant_id:
          type: string
          format: uuid
        restaurant_name:
          type: string
        recipient_email:
          type: string
          description: Immutable recipient address captured by the delivery attempt; legacy rows may be blank.
        account_id:
          type: string
          format: uuid
        account_key:
          type: string
        sender_email:
          type: string
          description: Exact outbound snapshot From address when recorded, otherwise the sender's current From address.
        campaign_step:
          type: integer
          minimum: 0
          description: Sequence email number. Values 1, 2, and 3 correspond to Emails/Phases 1, 2, and 3.
        status:
          type: string
          enum: [sending, sent, skipped, failed, unknown]
        outcome:
          type: string
          description: Safe operator label derived from status and controlled error code.
        error_code:
          type: string
          description: Controlled machine-readable error classification; raw provider responses are never returned.
        subject:
          type: string
          description: Exact outbound snapshot subject when one was recorded; otherwise blank.
        provider_message_id:
          type: string
          description: Opaque provider acceptance identifier when available.
        attempted_at:
          type: string
          format: date-time
        outcome_at:
          type: string
          format: date-time
          nullable: true
          description: Final outcome timestamp; omitted while the attempt is still in progress.
        sent_at:
          type: string
          format: date-time
          nullable: true
          description: Provider acceptance timestamp when one was recorded; it may remain on a later-reconciled failed or bounced attempt.

    DailyOutreachDeliveryList:
      type: object
      required: [date, timezone, summary, senders, deliveries, total, limit, offset]
      properties:
        date:
          type: string
          format: date
        timezone:
          type: string
          enum: [Australia/Sydney]
        summary:
          $ref: '#/components/schemas/OutreachDeliveryOutcomeCounts'
        senders:
          type: array
          items:
            $ref: '#/components/schemas/DailyOutreachDeliverySender'
        deliveries:
          type: array
          items:
            $ref: '#/components/schemas/DailyOutreachDelivery'
        total:
          type: integer
          minimum: 0
          description: Total matching attempts before pagination.
        limit:
          type: integer
          minimum: 1
          maximum: 100
        offset:
          type: integer
          minimum: 0

