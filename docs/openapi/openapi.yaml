    ConsultationCalendarSlot:
      type: object
      required:
        - date
        - time
        - iso
        - is_available
        - booked
        - past
        - effective_available
        - on_grid
      properties:
        date:
          type: string
          format: date
        time:
          type: string
          pattern: '^([01]\d|2[0-3]):[0-5]\d$'
        iso:
          type: string
          format: date-time
          description: Canonical RFC3339 slot start with the configured timezone offset.
        is_available:
          type: boolean
          description: Persisted override value, or the configured-hours default when no override exists.
        booked:
          type: boolean
          description: True when any confirmed consultation interval overlaps this candidate interval.
        past:
          type: boolean
        effective_available:
          type: boolean
          description: True only when the slot is enabled, unbooked, on-grid, and in the future.
        on_grid:
          type: boolean
          description: False only for a historical confirmed booking outside the current candidate grid.

    ConsultationCalendar:
      type: object
      required:
        - month
        - revision
        - booked_call_count
        - timezone
        - slot_duration_minutes
        - business_hour_start
        - business_hour_end
        - slots
      properties:
        month:
          type: string
          pattern: '^\d{4}-(0[1-9]|1[0-2])$'
        revision:
          type: integer
          format: int64
          minimum: 0
          description: Month revision to send as `expected_revision` on the next save.
        booked_call_count:
          type: integer
          minimum: 0
          description: Number of unique confirmed call records overlapping the month, independent of how many grid candidates each call blocks.
        timezone:
          type: string
          example: Australia/Sydney
        slot_duration_minutes:
          type: integer
          minimum: 1
        business_hour_start:
          type: string
          example: '09:00'
        business_hour_end:
          type: string
          example: '17:00'
        slots:
          type: array
          items:
            $ref: '#/components/schemas/ConsultationCalendarSlot'

    ConsultationCalendarUpdate:
      type: object
      required: [expected_revision, slots]
      additionalProperties: false
      properties:
        expected_revision:
          type: integer
          format: int64
          minimum: 0
          description: Exact revision returned by the calendar GET or preceding successful PUT.
        slots:
          type: array
          description: Complete set of future on-grid candidates plus any canonical same-month candidates that crossed into the past after loading.
          items:
            type: object
            required: [iso, is_available]
            additionalProperties: false
            properties:
              iso:
                type: string
                format: date-time
                description: Exact canonical RFC3339 value returned by the calendar GET.
              is_available:
                type: boolean

    ConsultationSlot:
      type: object
      required: [date, time, iso, available]
      properties:
        date:
          type: string
          format: date
        time:
          type: string
          pattern: '^([01]\d|2[0-3]):[0-5]\d$'
        iso:
          type: string
          format: date-time
          description: Canonical slot start using the configured consultation timezone offset.
        available:
          type: boolean

    ConsultationAvailabilityResult:
      type: object
      required: [status, slots]
      properties:
        status:
          type: string
          enum: [success]
        slots:
          type: array
          items:
            $ref: '#/components/schemas/ConsultationSlot'

    ConsultationCheckResult:
      type: object
      required: [available, slot, date, time]
      properties:
        available:
          type: boolean
        alternatives:
          type: array
          description: Nearest enabled, unbooked candidates when the requested slot is unavailable.
          items:
            type: string
            format: date-time
        slot:
          type: string
          format: date-time
        date:
          type: string
          format: date
        time:
          type: string
          pattern: '^([01]\d|2[0-3]):[0-5]\d$'

