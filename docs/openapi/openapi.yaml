    OutreachInboxThread:
      type: object
      required: [mailbox_key, mailbox_email, unmatched, unread_count, subject, text_snippet, from_email, to_email, received_at, last_direction, last_snippet, last_at, last_message_id, reply_message_id]
      properties:
        restaurant_id:
          type: string
          format: uuid
          nullable: true
        restaurant_name:
          type: string
        email:
          type: string
        mailbox_key:
          type: string
        mailbox_email:
          type: string
        unmatched:
          type: boolean
        unread_count:
          type: integer
          minimum: 0
        subject:
          type: string
          description: Subject of the latest received inbound message in this thread.
        text_snippet:
          type: string
          description: Whitespace-normalized preview of the latest received inbound message body, limited to 180 characters.
        from_email:
          type: string
          description: Sender of the latest received inbound message.
        to_email:
          type: string
          description: Recipient address captured on the latest received inbound message.
        received_at:
          type: string
          format: date-time
          description: Provider-received timestamp of the latest inbound message.
        last_direction:
          type: string
          enum: [outbound, inbound]
        last_snippet:
          type: string
        last_at:
          type: string
          format: date-time
        last_message_id:
          type: string
          format: uuid
        reply_message_id:
          type: string
          format: uuid
          description: Latest inbound message in this thread; replies target this snapshot even after an outbound response.

    OutreachInboxMailboxStatus:
      type: object
      required: [mailbox_key]
      properties:
